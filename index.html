<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Күнім — планировщик дня</title>
<link rel="stylesheet" href="style.css?v=11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4772fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Күнім">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">☀ Күнім</div>
    <nav id="smart"></nav>
    <div class="side-head"><span>Списки</span><button id="addList" title="Новый список">+</button></div>
    <nav id="lists"></nav>
    <nav id="tags"></nav>
    <button class="nav" id="syncBtn" style="margin-top:16px;font-size:13px;color:var(--muted)"></button>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header>
      <button id="menu" aria-label="Меню">☰</button>
      <h1 id="title"></h1>
      <input id="search" type="search" placeholder="Поиск…">
    </header>
    <div id="content">
      <form id="quick" autocomplete="off">
        <input id="quickInput" placeholder="+ Добавить задачу">
      </form>
      <div id="calendar" hidden></div>
      <div id="tasks"></div>
      <div id="timeline" hidden></div>
      <div id="extra" hidden></div>
    </div>
  </main>
  <section id="detail" hidden></section>
  <button id="fab" aria-label="Добавить задачу">+</button>
  <nav id="tabbar">
    <button data-view="today"><span>☀️</span>Сегодня</button>
    <button data-view="calendar"><span>📆</span>Календарь</button>
    <button data-view="matrix"><span>🔲</span>Матрица</button>
    <button data-view="focus"><span>🍅</span>Фокус</button>
    <button data-view="habits"><span>🔥</span>Привычки</button>
  </nav>
</div>
<script src="app.js?v=11"></script>
</body>
</html>
